<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" width="160" height="100" role="img" aria-label="Dash, Droid's character, tapping an app on a phone">
<style>
svg{--t-bg:#f6f7f8; --t-ink:#2b2f35; --t-mute:#7d848c; --t-wire:#cfd4d9; --t-tile:#ffffff; --t-soft:#e6e8eb; --d-body:#b9bfff; --d-top:#cdd1ff; --d-tip:#f1e9ff; --d-eye:#16151b; --d-tap:#5a5fd6; --d-line:#e6e7ff;}
@media (prefers-color-scheme: dark){svg{--t-bg:#1a1c1f; --t-ink:#d3d6da; --t-mute:#8a9198; --t-wire:#3a3f45; --t-tile:#24282d; --t-soft:#30353b; --d-body:#a3a9fa; --d-top:#bfc3ff; --d-tip:#e6ddff; --d-eye:#16151b; --d-tap:#b3b7ff; --d-line:#33355c;}}
</style>
<rect width="160" height="100" fill="var(--t-bg)"/>

<!-- the phone: Dash's line at the top, then apps -->
<rect x="96" y="9" width="44" height="82" rx="7" fill="var(--t-tile)" stroke="var(--t-ink)" stroke-width="1.3"/>
<rect x="102" y="18" width="32" height="8" rx="4" fill="var(--d-line)"/>
<g fill="var(--t-soft)">
  <rect x="102" y="33" width="7" height="7" rx="2"/>
  <rect x="102" y="45" width="7" height="7" rx="2"/>
  <rect x="102" y="57" width="7" height="7" rx="2"/>
  <rect x="102" y="69" width="7" height="7" rx="2"/>
</g>
<g fill="var(--t-wire)">
  <rect x="112" y="35" width="20" height="3" rx="1.5"/>
  <rect x="112" y="47" width="16" height="3" rx="1.5"/>
  <rect x="112" y="59" width="19" height="3" rx="1.5"/>
  <rect x="112" y="71" width="13" height="3" rx="1.5"/>
</g>
<!-- his tap -->
<circle cx="121" cy="48.5" r="6.5" fill="none" stroke="var(--d-tap)" stroke-width="1.2" opacity=".45"/>
<circle cx="121" cy="48.5" r="2.4" fill="var(--d-tap)"/>

<!-- from Dash to the app he taps -->
<path d="M66,46 Q82,33 96,40" fill="none" stroke="var(--t-mute)" stroke-width="1.1" stroke-dasharray="2.2 2.4" stroke-linecap="round"/>

<!-- Dash: his body, the hooked antenna, two dark eyes -->
<ellipse cx="44" cy="80" rx="15" ry="2.6" fill="var(--t-soft)"/>
<path d="M44,46 C44,40 44,36 47.5,33.2" fill="none" stroke="var(--d-body)" stroke-width="1.8" stroke-linecap="round"/>
<circle cx="48.6" cy="32.3" r="2.6" fill="var(--d-tip)" stroke="var(--d-body)" stroke-width=".8"/>
<defs><linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--d-top)"/><stop offset="1" style="stop-color:var(--d-body)"/></linearGradient></defs>
<path d="M44,44.6C53.4,44.6 61,52.8 61,63L61,65.1C61,72.9 54.1,79.3 45.7,79.3L42.3,79.3C33.9,79.3 27,72.9 27,65.1L27,63C27,52.8 34.6,44.6 44,44.6Z" fill="url(#body)"/>
<ellipse cx="38.4" cy="64" rx="3.3" ry="4.3" fill="var(--d-eye)"/>
<ellipse cx="51.1" cy="64" rx="3.3" ry="4.3" fill="var(--d-eye)"/>
<circle cx="39.4" cy="62.2" r="1.15" fill="#fff" opacity=".95"/>
<circle cx="52.1" cy="62.2" r="1.15" fill="#fff" opacity=".95"/>
</svg>
