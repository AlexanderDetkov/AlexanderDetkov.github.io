<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" width="160" height="100" role="img" aria-label="A prompt in the context baked into the network's weights">
<style>
svg{--t-bg:#f6f7f8; --t-soft:#ebeef0; --t-ink:#2b2f35; --t-mute:#7d848c; --t-wire:#cfd4d9; --t-wall:#dcdfe3; --t-teal:#2a8b80; --t-orange:#d47b22; --t-tile:#ffffff; --serif:"Source Serif 4",Georgia,"Times New Roman",serif; --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;}
@media (prefers-color-scheme: dark){svg{--t-bg:#1a1c1f; --t-soft:#23272b; --t-ink:#d3d6da; --t-mute:#8a9198; --t-wire:#3a3f45; --t-wall:#2c3035; --t-teal:#52b9ac; --t-orange:#ec9a48; --t-tile:#24282d;}}
.t-bg{fill:var(--t-bg)}
.t-soft{fill:var(--t-soft)}
.t-node{fill:var(--t-bg); stroke:var(--t-ink)}
.t-teal line{stroke:var(--t-teal)} .t-teal polygon{fill:var(--t-teal)}
.t-orange line{stroke:var(--t-orange)} .t-orange polygon{fill:var(--t-orange)}
.t-mute-arrow line{stroke:var(--t-mute)} .t-mute-arrow polygon{fill:var(--t-mute)}
.t-q{fill:var(--t-orange); font:600 15px/1 var(--serif)}
.t-label{fill:var(--t-mute); font:500 9.5px/1 var(--ui); letter-spacing:.02em}
.t-label--small{font-size:8.5px; font-style:italic}
.t-bubble{fill:none; stroke:var(--t-mute)}
.t-text{stroke:var(--t-teal)}
.t-wire{stroke:var(--t-wire)}
.t-hot{stroke:var(--t-teal)}
.t-teal-fill{fill:var(--t-teal)}
.t-grid{fill:none; stroke:var(--t-ink)}
.t-op line{stroke:var(--t-ink)}
.t-wall{fill:var(--t-wall)}
.t-surface{stroke:var(--t-mute)}
.t-solvent{fill:var(--t-teal); opacity:.38}
.t-path{fill:none; stroke:var(--t-mute); opacity:.9}
.t-bond{fill:none; stroke:var(--t-ink)}
.t-bead{fill:var(--t-orange); stroke:var(--t-bg); stroke-width:.8}

.t-wire-ink{fill:none; stroke:var(--t-mute)}
.t-ink-fill{fill:var(--t-ink)}
.t-box{fill:var(--t-bg); stroke:var(--t-ink)}
.t-op-mute line{stroke:var(--t-mute)}
.t-lattice{fill:var(--t-wire)}
.t-act{font:italic 600 10px/1 var(--serif)}
.t-act--r{fill:var(--t-teal)} .t-act--f{fill:var(--t-orange)}
.t-digit{fill:var(--t-ink); font:600 8px/1 var(--ui)}
.t-digit--on{fill:var(--t-bg)}
.t-liquid{fill:var(--t-teal); opacity:.15}
.t-tank{fill:none; stroke:var(--t-ink)}
.t-tube{fill:var(--t-wall); stroke:var(--t-ink)}
.t-meniscus{fill:none; stroke:var(--t-teal)}

.t-tile{fill:var(--t-tile); stroke:var(--t-ink)}
.t-tile-ghost{fill:none; stroke:var(--t-mute)}
.t-state{fill:var(--t-tile); stroke:var(--t-ink)}
.t-arc-teal{stroke:var(--t-teal)}
.t-arc-orange{stroke:var(--t-orange)}
.t-wire-line{fill:none; stroke:var(--t-wire)}
.t-patch{fill:var(--t-teal); opacity:.22}

.t-bubble-solid{fill:var(--t-tile); stroke:var(--t-mute)}
.t-outline{fill:none; stroke:var(--t-ink)}
</style>
<rect class="t-bg" x="0" y="0" width="160" height="100"/><path class="t-bubble-solid" d="M16,23 H56 Q62,23 62,29 V53 Q62,59 56,59 H29 L18.5,67 L21,59 H16 Q10,59 10,53 V29 Q10,23 16,23 Z" stroke-width="1.3" stroke-linejoin="round"/><line class="t-text" x1="18" y1="33" x2="52" y2="33" stroke-width="3.2" stroke-linecap="round" opacity="1.0"/><line class="t-text" x1="18" y1="41" x2="45" y2="41" stroke-width="3.2" stroke-linecap="round" opacity="0.62"/><line class="t-text" x1="18" y1="49" x2="37" y2="49" stroke-width="3.2" stroke-linecap="round" opacity="0.32"/><g class="t-mute-arrow"><line x1="70.0" y1="41.0" x2="82.9" y2="41.0" stroke-width="1.4" stroke-linecap="round"/><polygon points="87.0,41.0 82.4,43.8 82.4,38.2" stroke="none"/></g><text class="t-label t-label--small" x="78.5" y="34" text-anchor="middle">bake</text><line class="t-wire" x1="102" y1="27" x2="122" y2="34" stroke-width="0.75"/><line class="t-wire" x1="102" y1="27" x2="122" y2="48" stroke-width="0.75"/><line class="t-wire" x1="102" y1="27" x2="122" y2="62" stroke-width="0.75"/><line class="t-wire" x1="102" y1="41" x2="122" y2="20" stroke-width="0.75"/><line class="t-wire" x1="102" y1="41" x2="122" y2="62" stroke-width="0.75"/><line class="t-wire" x1="102" y1="55" x2="122" y2="20" stroke-width="0.75"/><line class="t-wire" x1="102" y1="55" x2="122" y2="34" stroke-width="0.75"/><line class="t-wire" x1="102" y1="55" x2="122" y2="48" stroke-width="0.75"/><line class="t-wire" x1="122" y1="20" x2="142" y2="41" stroke-width="0.75"/><line class="t-wire" x1="122" y1="20" x2="142" y2="55" stroke-width="0.75"/><line class="t-wire" x1="122" y1="34" x2="142" y2="27" stroke-width="0.75"/><line class="t-wire" x1="122" y1="34" x2="142" y2="55" stroke-width="0.75"/><line class="t-wire" x1="122" y1="48" x2="142" y2="27" stroke-width="0.75"/><line class="t-wire" x1="122" y1="48" x2="142" y2="55" stroke-width="0.75"/><line class="t-wire" x1="122" y1="62" x2="142" y2="27" stroke-width="0.75"/><line class="t-wire" x1="122" y1="62" x2="142" y2="41" stroke-width="0.75"/><line class="t-hot" x1="102" y1="27" x2="122" y2="20" stroke-width="1.7" stroke-linecap="round"/><line class="t-hot" x1="102" y1="41" x2="122" y2="34" stroke-width="1.7" stroke-linecap="round"/><line class="t-hot" x1="102" y1="41" x2="122" y2="48" stroke-width="1.7" stroke-linecap="round"/><line class="t-hot" x1="102" y1="55" x2="122" y2="62" stroke-width="1.7" stroke-linecap="round"/><line class="t-hot" x1="122" y1="20" x2="142" y2="27" stroke-width="1.7" stroke-linecap="round"/><line class="t-hot" x1="122" y1="34" x2="142" y2="41" stroke-width="1.7" stroke-linecap="round"/><line class="t-hot" x1="122" y1="48" x2="142" y2="41" stroke-width="1.7" stroke-linecap="round"/><line class="t-hot" x1="122" y1="62" x2="142" y2="55" stroke-width="1.7" stroke-linecap="round"/><circle class="t-state" cx="102" cy="27" r="3.6" stroke-width="1.3"/><circle class="t-state" cx="102" cy="41" r="3.6" stroke-width="1.3"/><circle class="t-state" cx="102" cy="55" r="3.6" stroke-width="1.3"/><circle class="t-state" cx="122" cy="20" r="3.6" stroke-width="1.3"/><circle class="t-state" cx="122" cy="34" r="3.6" stroke-width="1.3"/><circle class="t-state" cx="122" cy="48" r="3.6" stroke-width="1.3"/><circle class="t-state" cx="122" cy="62" r="3.6" stroke-width="1.3"/><circle class="t-state" cx="142" cy="27" r="3.6" stroke-width="1.3"/><circle class="t-state" cx="142" cy="41" r="3.6" stroke-width="1.3"/><circle class="t-state" cx="142" cy="55" r="3.6" stroke-width="1.3"/><text class="t-label" x="36" y="93" text-anchor="middle">context</text><text class="t-label" x="122" y="93" text-anchor="middle">weights</text></svg>
