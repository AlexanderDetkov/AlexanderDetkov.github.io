h="0.5"/><rect class="t-grid" x="29" y="38" width="4" height="12" stroke-width="0.9"/><rect class="t-teal-fill" x="29" y="66" width="4" height="4" opacity="0.32"/><rect class="t-grid" x="29" y="66" width="4" height="4" stroke-width="0.9"/><circle class="t-node" cx="54" cy="44" r="4.5" stroke-width="1.2"/><path class="t-wire-ink" d="M51.4,44 H56.6 M54,41.4 V46.6" stroke-width="1.1"/><path class="t-wire-ink" d="M58.5,44 H65" stroke-width="1.2"/><g class="t-op-mute" stroke-width="1.6" stroke-linecap="round"><line x1="71" y1="41" x2="79" y2="41"/><line x1="71" y1="47" x2="79" y2="47"/></g><path class="t-wire-ink" d="M86,44 H100 M140,44 H152" stroke-width="1.2"/><circle class="t-ink-fill" cx="86" cy="44" r="2.2"/><rect class="t-box" x="100" y="24" width="40" height="40" rx="3" stroke-width="1.3"/><rect class="t-teal-fill" x="106.5" y="30.5" width="9" height="9" opacity="0.22"/><rect class="t-teal-fill" x="115.5" y="30.5" width="9" height="9" opacity="0.5"/><rect class="t-teal-fill" x="124.5" y="30.5" width="9" height="9" opacity="0.22"/><rect class="t-teal-fill" x="106.5" y="39.5" width="9" height="9" opacity="0.22"/><rect class="t-teal-fill" x="115.5" y="39.5" width="9" height="9" opacity="0.85"/><rect class="t-teal-fill" x="124.5" y="39.5" width="9" height="9" opacity="0.22"/><rect class="t-teal-fill" x="106.5" y="48.5" width="9" height="9" opacity="0.22"/><rect class="t-teal-fill" x="115.5" y="48.5" width="9" height="9" opacity="0.5"/><rect class="t-teal-fill" x="124.5" y="48.5" width="9" height="9" opacity="0.22"/><line class="t-grid" x1="115.5" y1="30.5" x2="115.5" y2="57.5" stroke-width="0.7"/><line class="t-grid" x1="124.5" y1="30.5" x2="124.5" y2="57.5" stroke-width="0.7"/><line class="t-grid" x1="106.5" y1="39.5" x2="133.5" y2="39.5" stroke-width="0.7"/><line class="t-grid" x1="106.5" y1="48.5" x2="133.5" y2="48.5" stroke-width="0.7"/><rect class="t-grid" x="106.5" y="30.5" width="27" height="27" stroke-width="1.2"/><text class="t-label" x="36" y="93" text-anchor="middle">multi-branch</text><text class="t-label" x="120" y="93" text-anchor="middle">scaled gradients</text></svg>
